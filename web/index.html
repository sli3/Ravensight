// "2026-10-22" as "22 Oct", or "22 Oct 2026" when full. Text only, no Date. A month
// outside 1 to 12 keeps the raw text.
function dayText(text, full) {
  const month = parseInt(text.slice(5, 7), 10);
  if (!(month >= 1 && month <= 12)) {
    return text;
  }
  const label = String(parseInt(text.slice(8, 10), 10)) + " " + MONTH_SHORT[month - 1];
  return full ? label + " " + text.slice(0, 4) : label;
}

// The count axis: a step of 1, 2 or 5 times a power of ten, about 4 intervals.
function niceScale(max) {
  if (!(max > 0)) {
    return {top: 1, ticks: [0, 1]};
  }
  const raw = Math.max(1, max / 4);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = mag * 10;
  for (const factor of [1, 2, 5]) {
    if (factor * mag >= raw) {
      step = factor * mag;
      break;
    }
  }
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top; v += step) {
    ticks.push(v);
  }
  return {top: top, ticks: ticks};
}

// Colour and dash come from the row index only, never from data.
function seriesClass(i) {
  return "tr-c" + (i % 8) + " tr-d" + (Math.floor(i / 8) % 3);
}

function trendWidth(host) {
  return Math.max(TREND_MIN_WIDTH, host.clientWidth || TREND_FALLBACK_WIDTH);
}

// The lines drawn at first: new or anomalous rows, then the rest by latest count.
function defaultTrendSelection(rows) {
  const flagged = rows.filter(function (r) { return r.direction === "new" || r.anomaly; });
  const rest = rows.filter(function (r) { return flagged.indexOf(r) < 0; })
    .map(function (r, pos) { return {row: r, pos: pos}; })
    .sort(function (a, b) {
      const la = a.row.latest === null ? 0 : a.row.latest;
      const lb = b.row.latest === null ? 0 : b.row.latest;
      return lb - la || a.pos - b.pos;
    })
    .map(function (e) { return e.row; });
  const selected = {};
  for (const r of flagged.concat(rest).slice(0, TREND_DEFAULT_LINES)) {
    selected[r.index] = true;
  }
  return selected;
}

// Which day positions get a label: every step-th one, and the last one if there is room.
function dayLabelIndices(n, plotW, labelW, xAt) {
  const fit = Math.max(1, Math.floor(plotW / labelW));
  const step = Math.ceil(n / fit);
  const picked = [];
  for (let i = 0; i < n; i += step) {
    picked.push(i);
  }
  const last = n - 1;
  if (picked[picked.length - 1] !== last &&
      xAt(last) - xAt(picked[picked.length - 1]) >= labelW) {
    picked.push(last);
  }
  return picked;
}

function seriesNode(row, xAt, yAt, days, full) {
  const group = svgEl("g", {"class": "tr-series " + seriesClass(row.index), "tabindex": "0", "role": "img"});
  const name = row.direction === "" ? row.label : row.label + ", " + row.direction;
  const spoken = [];
  row.values.forEach(function (v, k) {
    if (v !== null) {
      spoken.push(dayText(days[k], full) + " " + v);
    }
  });
  group.setAttribute("aria-label", name + ": " + (spoken.length ? spoken.join(", ") : "no counts"));
  group.appendChild(svgEl("title", {}, name));
  let run = [];
  const flush = function () {
    if (run.length >= 2) {
      group.appendChild(svgEl("polyline", {
        "class": "tr-path",
        "points": run.map(function (pt) { return pt[0].toFixed(1) + "," + pt[1].toFixed(1); }).join(" ")
      }));
    }
    run = [];
  };
  const dots = [];
  row.values.forEach(function (v, k) {
    if (v === null) {
      flush();
      return;
    }
    const x = xAt(k);
    const y = yAt(v);
    run.push([x, y]);
    dots.push({x: x, y: y, tip: row.label + ", " + dayText(days[k], full) + ": " + v});
  });
  flush();
  for (const d of dots) {
    const dot = svgEl("circle", {"cx": d.x.toFixed(1), "cy": d.y.toFixed(1), "r": "3.5", "class": "tr-dot"});
    dot.appendChild(svgEl("title", {}, d.tip));
    group.appendChild(dot);
  }
  return group;
}

// Draws the chart for the selected rows into the host. The host is cleared first.
function drawTrend() {
  const st = view.trend;
  if (!st) {
    return;
  }
  clear(st.host);
  const tm = st.model;
  const W = trendWidth(st.host);
  st.width = W;
  const shown = tm.rows.filter(function (r) { return st.selected[r.index] === true; });
  if (shown.length === 0) {
    st.host.appendChild(el("p", "No findings selected. Select a row's button to draw its line.", "empty"));
    return;
  }
  const H = TREND_HEIGHT;
  let max = 0;
  for (const r of shown) {
    for (const v of r.values) {
      if (v !== null && v > max) {
        max = v;
      }
    }
  }
  const scale = niceScale(max);
  const longest = Math.max.apply(null, scale.ticks.map(function (v) { return String(v).length; }));
  const left = Math.max(36, 8 + 7 * longest + 8);
  const right = 16;
  const top = 12;
  const bottom = 30;
  const plotW = W - left - right;
  const plotH = H - top - bottom;
  const n = tm.days.length;
  const xAt = function (k) {
    return n === 1 ? left + plotW / 2 : left + 12 + (plotW - 24) * k / (n - 1);
  };
  const yAt = function (v) { return top + plotH * (1 - v / scale.top); };
  const svg = svgEl("svg", {
    "class": "tr-svg", "viewBox": "0 0 " + W + " " + H, "width": W, "height": H,
    "role": "group", "aria-label": "Daily counts per finding"
  });
  for (const v of scale.ticks) {
    const y = yAt(v).toFixed(1);
    svg.appendChild(svgEl("line", {
      "class": v === 0 ? "tr-axis" : "tr-grid", "x1": left, "x2": W - right, "y1": y, "y2": y
    }));
    svg.appendChild(svgEl("text", {
      "class": "tr-tick", "x": left - 6, "y": (yAt(v) + 4).toFixed(1), "text-anchor": "end"
    }, String(v)));
  }
  const labels = tm.days.map(function (d) { return dayText(d, tm.multiYear); });
  const longestDay = Math.max.apply(null, labels.map(function (l) { return l.length; }));
  const labelW = 7 * longestDay + 14;
  for (const k of dayLabelIndices(n, plotW, labelW, xAt)) {
    const half = 3.5 * labels[k].length;
    const x = Math.min(Math.max(xAt(k), half + 2), W - half - 2);
    svg.appendChild(svgEl("text", {
      "class": "tr-tick", "x": x.toFixed(1), "y": H - 10, "text-anchor": "middle"
    }, labels[k]));
  }
  for (const row of shown) {
    svg.appendChild(seriesNode(row, xAt, yAt, tm.days, tm.multiYear));
  }
  st.host.appendChild(svg);
}

// A redraw after a click or a resize: a failure replaces the chart with a message, never
// the page. The state stays set, so a later toggle or resize can draw again.
function redrawTrend() {
  try {
    drawTrend();
  } catch (err) {
    const st = view.trend;
    if (st) {
      clear(st.host);
      st.host.appendChild(el("p",
        "The chart could not be drawn. The table below still shows every value.", "empty"));
    }
  }
}

// A small line for one row on its own scale (0 to the row's highest count). It uses the
// same values and gaps as the chart: a line for a run of 2 or more days, a dot for 1.
function sparkNode(row) {
  const svg = svgEl("svg", {
    "class": "tr-spark", "width": SPARK_WIDTH, "height": SPARK_HEIGHT,
    "aria-hidden": "true", "focusable": "false"
  });
  const n = row.values.length;
  if (n === 0) {
    return svg;
  }
  let max = 0;
  for (const v of row.values) {
    if (v !== null && v > max) {
      max = v;
    }
  }
  const padX = 4;
  const padY = 4;
  const xAt = function (k) {
    return n === 1 ? SPARK_WIDTH / 2 : padX + (SPARK_WIDTH - 2 * padX) * k / (n - 1);
  };
  const yAt = function (v) {
    return max > 0 ? padY + (SPARK_HEIGHT - 2 * padY) * (1 - v / max) : SPARK_HEIGHT - padY;
  };
  let run = [];
  const flush = function () {
    if (run.length >= 2) {
      svg.appendChild(svgEl("polyline", {
        "class": "tr-spark-line",
        "points": run.map(function (pt) { return pt[0].toFixed(1) + "," + pt[1].toFixed(1); }).join(" ")
      }));
    } else if (run.length === 1) {
      svg.appendChild(svgEl("circle", {
        "class": "tr-spark-dot", "cx": run[0][0].toFixed(1), "cy": run[0][1].toFixed(1), "r": "2.5"
      }));
    }
    run = [];
  };
  row.values.forEach(function (v, k) {
    if (v === null) {
      flush();
      return;
    }
    run.push([xAt(k), yAt(v)]);
  });
  flush();
  return svg;
}

function numText(value, digits) {
  if (value === null) {
    return NO_VALUE_TEXT;
  }
  return digits === undefined ? String(value) : value.toFixed(digits);
}

// One table row with a toggle button that shows or hides the row's line in the chart.
// The state is keyed by the row index, never by the label.
function trendRow(row, st) {
  const tr = el("tr", "", seriesClass(row.index));
  const toggle = el("button", "", "tr-toggle");
  toggle.setAttribute("type", "button");
  const on = st.selected[row.index] === true;
  toggle.setAttribute("aria-pressed", on ? "true" : "false");
  const swatch = el("span", "", "tr-sw tr-sw-d" + (Math.floor(row.index / 8) % 3));
  swatch.setAttribute("aria-hidden", "true");
  add(toggle, [swatch, el("span", row.label, "tr-label")]);
  toggle.addEventListener("click", function () {
    st.selected[row.index] = st.selected[row.index] !== true;
    const now = st.selected[row.index] === true;
    toggle.setAttribute("aria-pressed", now ? "true" : "false");
    redrawTrend();
  });
  const name = el("th", "", "tr-name");
  name.setAttribute("scope", "row");
  name.appendChild(toggle);
  const dir = el("td", row.direction, "tr-dir");
  if (row.anomaly) {
    dir.appendChild(el("span", "anomaly", "tr-flag"));
  }
  const spark = el("td", "", "tr-spark-cell");
  spark.appendChild(sparkNode(row));
  add(tr, [
    name,
    el("td", numText(row.avg, 1), "tr-num"),
    el("td", numText(row.latest), "tr-num"),
    dir,
    spark
  ]);
  return tr;
}

// The caption of one trends table, hidden visually but read by assistive technology.
function trendCaption(text) {
  return el("caption", text, "map-caption");
}

// The fixed column widths, shared by both trends tables.
function trendColgroup() {
  const group = el("colgroup");
  for (const cls of ["tr-col-name", "tr-col-num", "tr-col-num", "tr-col-dir", "tr-col-spark"]) {
    group.appendChild(el("col", "", cls));
  }
  return group;
}

// The header row, shared by both trends tables. cls is "" or the class for a hidden header.
function trendHead(cls) {
  const headRow = el("tr");
  for (const title of TREND_COLUMNS) {
    const th = el("th", title, title === "Avg/day" || title === "Latest" ? "tr-num" : "");
    th.setAttribute("scope", "col");
    headRow.appendChild(th);
  }
  return add(el("thead", "", cls), [headRow]);
}

// One table of rows, with the caption, column widths and header.
function trendPart(caption, rows, st, headCls) {
  const table = el("table", "", "tr-table");
  add(table, [trendCaption(caption), trendColgroup(), trendHead(headCls)]);
  table.appendChild(add(el("tbody"), rows.map(function (row) { return trendRow(row, st); })));
  return table;
}

// The findings drawn at first sit in the first table. The rest, in the report's own order,
// sit in a closed details element with a second table. A row keeps its place on a toggle.
function trendTable(lead, more, st) {
  const scroll = el("div", "", "tr-scroll");
  scroll.appendChild(trendPart("Trends by finding", lead, st, ""));
  if (more.length > 0) {
    const details = el("details", "", "table-view");
    details.appendChild(el("summary", more.length === 1 ? "1 more finding" : more.length + " more findings"));
    details.appendChild(trendPart("More trends by finding", more, st, "tr-head-off"));
    scroll.appendChild(details);
  }
  return scroll;
}

// Fills the trends body with the notes, the chart and the table. Returns true only if the chart and table were drawn.
function renderTrendChart(body, tm) {
  const n = tm.days.length;
  const opening = n === 1 ? "one point for the 1 day with a daily run"
    : "one point for each of the " + n + " days with a daily run";
  let windowText = "";
  if (tm.windowDays !== null) {
    windowText = tm.windowDays === 1 ? " in the last day" : " in the last " + tm.windowDays + " days";
  }
  body.appendChild(el("p", "Daily counts, " + opening + windowText + ". Each line is one finding. " +
    "Select a row's button to show or hide its line. " +
    "Each small line uses its own scale, from 0 to that finding's highest daily count. " +
    "Days with no daily run are not on the axis.", "note"));
  if (tm.hidden > 0) {
    body.appendChild(el("p", (tm.hidden === 1 ? "1 more finding is" : tm.hidden + " more findings are") +
      " not in this report's trends table.", "note"));
  }
  if (tm.empty) {
    body.appendChild(el("p", "This report's trends table has no findings to draw.", "empty"));
    return false;
  }
  const host = el("div", "", "tr-host");
  const initial = defaultTrendSelection(tm.rows);
  const lead = tm.rows.filter(function (row) { return initial[row.index] === true; });
  const more = tm.rows.filter(function (row) { return initial[row.index] !== true; });
  const st = {model: tm, selected: Object.assign({}, initial), host: host, width: 0};
  add(body, [host, trendTable(lead, more, st)]);
  view.trend = st;
  redrawTrend();
  return true;
}

function renderTrends(model) {
  const body = document.getElementById("trends-body");
  clear(body);
  showSection("trends");
  let drawn = false;
  if (model.trend !== null) {
    try {
      drawn = renderTrendChart(body, model.trend);
    } catch (err) {
      view.trend = null;
      clear(body);
    }
  }
  if (model.trends !== null) {
    const text = el("pre", model.trends, "trends-pre");
    if (drawn) {
      const details = el("details", "", "table-view");
      details.appendChild(el("summary", "Text version"));
      details.appendChild(text);
      body.appendChild(details);
    } else {
      body.appendChild(text);
    }
  } else if (!drawn && !body.hasChildNodes()) {
    body.appendChild(el("p", "No trend data", "empty"));
  }
  showSection("trends");
}

function renderTerms() {
  const body = document.getElementById("terms-body");
  clear(body);
  const details = el("details", "", "table-view");
  details.appendChild(el("summary", "Show the terms"));
  const list = el("dl", "", "terms-list");
  for (const [term, meaning] of TERMS) {
    add(list, [el("dt", term), el("dd", meaning)]);
  }
  details.appendChild(list);
  body.appendChild(details);
  showSection("terms");
}

function renderReport(model) {
  view.model = model;
  view.selected = 0;
  view.pressables = [];
  indexEssentials(model.essentials);
  renderHeader(model);
  renderHowTo();
  renderOverview(model);
  renderTimeline(model);
  renderFindings(model);
  renderTrends(model);
  renderEssentials(model);
  renderE8(model);
  renderTerms();
  showSection("nav");
}

// ---------------------------------------------------------------------------
// Loading a file
// ---------------------------------------------------------------------------

function loadReport(text) {
  resetView();
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    showMessage("This file is not valid JSON, so it cannot be shown.", true);
    return;
  }
  if (!isObj(data)) {
    showMessage("This file is JSON, but it is not a Ravensight report.", true);
    return;
  }
  const version = rd(data, "schema_version");
  if (SUPPORTED_SCHEMAS.indexOf(version) < 0) {
    let seen;
    if (version === undefined) {
      seen = "This report has no schema version.";
    } else if (isNum(version)) {
      seen = "This report is schema version " + String(version) + ".";
    } else {
      seen = "The schema_version in this report must be a number, but it is " +
        describeFound(version) + ".";
    }
    showMessage("This viewer reads schema versions " + SUPPORTED_SCHEMAS.join(" and ") + ". " + seen, true);
    return;
  }
  try {
    renderReport(buildModel(data));
    showMessage("Report loaded.", false);
  } catch (err) {
    resetView();
    showMessage("The report could not be shown. The file may be damaged.", true);
  }
}

function readFileText(file) {
  if (typeof file.text === "function") {
    return file.text();
  }
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.addEventListener("load", function () { resolve(String(reader.result)); });
    reader.addEventListener("error", function () { reject(new Error("read")); });
    reader.readAsText(file);
  });
}

// Counts file picks, so a slow read from an earlier pick is ignored once a newer one starts.
let latestPick = 0;

function onFileChosen(event) {
  const input = event.target;
  const file = input.files && input.files.length ? input.files[0] : null;
  if (!file) {
    return;
  }
  latestPick += 1;
  const mine = latestPick;
  if (file.size > MAX_FILE_BYTES) {
    resetView();
    showMessage("This file is larger than " + Math.round(MAX_FILE_BYTES / (1024 * 1024)) +
      " MB, so it is not opened.", true);
    input.value = "";
    return;
  }
  resetView();
  showMessage("Reading the file.", false);
  readFileText(file)
    .then(function (text) {
      if (mine === latestPick) {
        loadReport(text);
      }
    })
    .catch(function () {
      if (mine === latestPick) {
        resetView();
        showMessage("The file could not be read.", true);
      }
    });
  input.value = "";
}

document.getElementById("report-file").addEventListener("change", onFileChosen);

// Redraw the trends chart when the page width changes, only if a chart is shown.
let resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    const st = view.trend;
    if (st && trendWidth(st.host) !== st.width) {
      redrawTrend();
    }
  }, TREND_RESIZE_PAUSE_MS);
});
</script>
