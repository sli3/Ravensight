services:
  ravensight:
    build: .
    image: ravensight:latest
    container_name: ravensight
    env_file:
      - .env
    volumes:
      - ${RAVENSIGHT_HOST_DATA_PATH:-./data}:/app/data
      - ${RAVENSIGHT_HOST_REPORTS_PATH:-./reports}:/app/reports
      - ${RAVENSIGHT_HOST_CONFIG_PATH:-./config.toml}:/app/config.toml:ro
    # Default run is a normal analysis pass (see Dockerfile CMD).
    # Override at the command line for a one-off, e.g.:
    #   docker compose run --rm ravensight sync

  # Optional bundled ChromaDB server — only starts under the 'chroma' profile.
  # Activate with: docker compose --profile chroma up -d chroma
  # Then point Ravensight at it by setting chroma_host = "chroma" (and
  # chroma_port = 8000) in config.toml
  # (empty chroma_host keeps today's embedded mode unchanged).
  # Image tag pinned to match chromadb==1.5.9 in requirements.txt — see
  # https://docs.trychroma.com for the REST API changes between versions.
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: ravensight-chroma
    profiles: ["chroma"]
    environment:
      - IS_PERSISTENT=TRUE  # legacy 0.x flag, harmless no-op in 1.x; persistence is on by default (Rust server, /config.yaml)
    volumes:
      - ${RAVENSIGHT_HOST_CHROMA_PATH:-./data/chroma/server}:/data  # 1.5.9 image default persist_directory (was /chroma/chroma in 0.6.x)
    ports:
      - "127.0.0.1:${RAVENSIGHT_CHROMA_PORT:-8000}:8000"
