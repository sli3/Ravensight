model = "gpt-6.1-sol"
approval_policy = "never"
default_permissions = "ravensight"
web_search = "disabled"

[permissions.ravensight]
extends = ":workspace"

[permissions.ravensight.filesystem.":workspace_roots"]
"config.toml" = "deny"
"data" = "deny"
"AGENTS.md" = "read"
"CLAUDE.md" = "read"
".claude" = "read"
".codex" = "read"
".git" = "read"
"docs/RAVENSIGHT_ROADMAP.md" = "read"
"docs/roadmap-archive.md" = "read"

[shell_environment_policy]
ignore_default_excludes = false