# This one file is used for host runs and is mounted read-only into Docker.
# For Docker, wazuh and llm hosts must be reachable from inside the container:
# use real hostnames or IPs, not localhost.
# Relative paths below (data/..., reports) should stay as written: the container
# runs from /app and mounts /app/data and /app/reports. For a host run they are
# relative to where you start Ravensight.

[wazuh]
# Wazuh host: the default Indexer host when indexer_host is not set
host = "YOUR_WAZUH_HOST"

# Wazuh Indexer (OpenSearch) — usually same host, port 9200
indexer_host = "YOUR_WAZUH_INDEXER_IP"
indexer_port = 9200
indexer_user = "admin"
indexer_password = "YOUR_INDEXER_PASSWORD"
# Optional TLS verification for the Indexer. Default false (no verification), which
# suits the self-signed certificate Wazuh ships with.
# Set true to verify against the bundled public CA list (certifi), not the operating
# system store. For a private or self-signed CA, set indexer_ca_path instead.
indexer_verify_tls = false
# Optional path to a CA certificate (or CA folder) used to verify the Indexer. Default
# "" (unset). A set path wins over indexer_verify_tls = false. Verification also checks
# the hostname, so a self-signed certificate must carry the indexer_host name or IP
# in its SAN.
indexer_ca_path = ""

[llm]
base_url = "http://YOUR_LLAMA_CPP_SERVER_IP:8080/v1"
api_key = "local"
model = "Ornith-1.5-9B"
temperature = 0.3
max_tokens = 1024

[reports]
output_dir = "reports"
# false (default) writes reports/<date>/security_report_<time>.md so reruns never overwrite.
# true writes reports/<date>_security_report.md and overwrites the same-day file.
overwrite = false
# true (default) also writes a JSON copy of each report beside the markdown.
# Must be exactly true or false.
json_output = true

[baseline]
path = "data/baseline_state.json"

[trending]
# Rolling window in days for trend analysis
window_days = 30
# Maximum rows shown in the trends table
max_rows = 25

[mitre]
# Path to local MITRE ATT&CK dataset (JSON format)
path = "data/mitre_attack.json"
# Reference only: Ravensight does not read this key. scripts/mitre_sync.py takes its URL from --source, or falls back to its built-in DEFAULT_SOURCE_URL when --source is not given.
sync_source = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"

# Comment out or remove this entire section (or leave it empty) to disable
# embeddings — runs then skip similarity and vector-store features and
# create no data/chroma/embedded directory.

[embeddings]
endpoint = "http://localhost:8081/v1"
model = "Qwen3-Embedding-0.6B"
chroma_db_path = "data/chroma/embedded"
# Optional: set chroma_host to switch to networked/server mode (chromadb.HttpClient).
# In server mode, chroma_db_path is ignored and no local data/chroma/embedded directory is created.
# In Docker, chroma_host = "chroma" with chroma_port = 8000 is the value for the bundled
# Chroma service (start it with the `chroma` profile). Use "localhost" for a host app
# with Docker-hosted Chroma.
# chroma_host = "YOUR_CHROMA_SERVER_IP"
# chroma_port = 8000
top_k = 5

[asd]
path = "data/asd_framework.json"

[e8]
overrides_path = "data/e8_keyword_overrides.json"
# Manual Essential Eight attestations (copy data/defaults/e8_attestation.example.json).
# Entries whose reason still starts with "EXAMPLE:" are skipped, so replace that text.
attestation_path = "data/e8_attestation.json"

[essentials]
# ASD Essentials for enterprise IT dataset (CC BY 4.0, © Commonwealth of Australia 2026).
# Reference data, do not edit. This path is for a host run; Docker handling comes later.
path = "data/defaults/essentials_enterprise_it.json"
# Manual Essentials attestations (copy data/defaults/essentials_attestation.example.json).
# Ratings are your own declaration, not an ASD assessment. Entries whose reason still
# starts with "EXAMPLE:" are skipped. This path is for a host run; Docker handling comes later.
attestation_path = "data/essentials_attestation.json"

[platform]
# Path to platform false positive hint table
# Edit this file directly to add new hints — no code change required
hints_path = "data/platform_hints.json"
# Optional map from Wazuh agent name to {platform, vendor}. Lets reports name
# the right product even when the rule description says something different.
# File is git-ignored and never seeded — copy data/defaults/platform_agents.example.json
# to data/platform_agents.json to start.
agents_path = "data/platform_agents.json"